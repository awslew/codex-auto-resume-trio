name: CI

on:
  push:
  pull_request:

jobs:
  resume-core:
    name: resume-core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/resume-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/resume-core/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  taskboard-typecheck:
    name: taskboard-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/taskboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/taskboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
